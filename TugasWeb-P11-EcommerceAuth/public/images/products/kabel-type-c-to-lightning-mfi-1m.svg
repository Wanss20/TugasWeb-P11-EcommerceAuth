<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
    <defs>
        <linearGradient id="grad_13" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2563eb" />
            <stop offset="100%" stop-color="#1e3a8a" />
        </linearGradient>
        <radialGradient id="glow_13" cx="50%" cy="40%" r="50%">
            <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
        </radialGradient>
        <filter id="shadow_13" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
        </filter>
    </defs>
    
    <!-- Background Card -->
    <rect width="400" height="300" rx="16" fill="url(#grad_13)" />
    <circle cx="200" cy="130" r="140" fill="url(#glow_13)" />

    <!-- Top Badge -->
    <rect x="24" y="20" width="130" height="28" rx="14" fill="#000000" opacity="0.4"/>
    <text x="89" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">★ MFi Certified</text>

    <!-- Gadget Illustration -->
                <g transform="translate(140, 65)">
                <!-- Cable coils -->
                <path d="M20 90 Q 60 20, 100 90 T 60 130" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
                <!-- Connector Heads -->
                <rect x="10" y="80" width="24" height="40" rx="6" fill="#ffffff" filter="drop-shadow(0 6px 10px rgba(0,0,0,0.3))"/>
                <rect x="16" y="65" width="12" height="18" rx="3" fill="#cbd5e1"/>
                <rect x="86" y="80" width="24" height="40" rx="6" fill="#ffffff" filter="drop-shadow(0 6px 10px rgba(0,0,0,0.3))"/>
                <rect x="92" y="65" width="12" height="18" rx="3" fill="#cbd5e1"/>
            </g>

    <!-- Bottom Glass Info Bar -->
    <rect x="16" y="215" width="368" height="68" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" filter="url(#shadow_13)"/>
    
    <!-- Text Labels -->
    <text x="32" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="0.5">TYPE-C TO LIGHTNING</text>
    <text x="32" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#60a5fa">Power Delivery Fast Charge</text>
    <text x="368" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="end">KSN</text>
</svg>