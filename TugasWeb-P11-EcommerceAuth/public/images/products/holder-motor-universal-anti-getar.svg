<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
    <defs>
        <linearGradient id="grad_40" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7f1d1d" />
            <stop offset="100%" stop-color="#450a0a" />
        </linearGradient>
        <radialGradient id="glow_40" cx="50%" cy="40%" r="50%">
            <stop offset="0%" stop-color="#f87171" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#450a0a" stop-opacity="0"/>
        </radialGradient>
        <filter id="shadow_40" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
        </filter>
    </defs>
    
    <!-- Background Card -->
    <rect width="400" height="300" rx="16" fill="url(#grad_40)" />
    <circle cx="200" cy="130" r="140" fill="url(#glow_40)" />

    <!-- Top Badge -->
    <rect x="24" y="20" width="130" height="28" rx="14" fill="#000000" opacity="0.4"/>
    <text x="89" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">★ Anti-Vibration</text>

    <!-- Gadget Illustration -->
                <g transform="translate(140, 65)">
                <!-- Stand base -->
                <rect x="25" y="105" width="70" height="12" rx="6" fill="#ffffff" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.3))"/>
                <!-- Stem -->
                <rect x="54" y="55" width="12" height="55" rx="4" fill="#cbd5e1"/>
                <!-- Clamp / Mount -->
                <rect x="35" y="30" width="50" height="30" rx="6" fill="#f87171" filter="drop-shadow(0 8px 12px rgba(0,0,0,0.3))"/>
                <rect x="42" y="38" width="36" height="14" rx="3" fill="#ffffff"/>
            </g>

    <!-- Bottom Glass Info Bar -->
    <rect x="16" y="215" width="368" height="68" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" filter="url(#shadow_40)"/>
    
    <!-- Text Labels -->
    <text x="32" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="0.5">HOLDER MOTOR HP</text>
    <text x="32" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#f87171">Handlebar Mount Anti Begal</text>
    <text x="368" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="end">KSN</text>
</svg>