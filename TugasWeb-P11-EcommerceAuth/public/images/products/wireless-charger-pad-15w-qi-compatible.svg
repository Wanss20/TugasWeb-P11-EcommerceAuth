<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
    <defs>
        <linearGradient id="grad_7" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8b5cf6" />
            <stop offset="100%" stop-color="#4c1d95" />
        </linearGradient>
        <radialGradient id="glow_7" cx="50%" cy="40%" r="50%">
            <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#4c1d95" stop-opacity="0"/>
        </radialGradient>
        <filter id="shadow_7" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
        </filter>
    </defs>
    
    <!-- Background Card -->
    <rect width="400" height="300" rx="16" fill="url(#grad_7)" />
    <circle cx="200" cy="130" r="140" fill="url(#glow_7)" />

    <!-- Top Badge -->
    <rect x="24" y="20" width="130" height="28" rx="14" fill="#000000" opacity="0.4"/>
    <text x="89" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">★ 15W Fast Qi</text>

    <!-- Gadget Illustration -->
                <g transform="translate(140, 65)">
                <!-- Base disc -->
                <ellipse cx="60" cy="80" rx="60" ry="40" fill="#ffffff" filter="drop-shadow(0 15px 20px rgba(0,0,0,0.3))"/>
                <ellipse cx="60" cy="76" rx="48" ry="30" fill="#f1f5f9"/>
                <ellipse cx="60" cy="74" rx="32" ry="20" fill="#c084fc" opacity="0.3"/>
                <!-- Qi / Lightning icon -->
                <path d="M62 60 L54 74 L60 74 L58 86 L68 70 L62 70 Z" fill="#c084fc"/>
            </g>

    <!-- Bottom Glass Info Bar -->
    <rect x="16" y="215" width="368" height="68" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" filter="url(#shadow_7)"/>
    
    <!-- Text Labels -->
    <text x="32" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="0.5">WIRELESS CHARGER</text>
    <text x="32" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#c084fc">Fast Qi Magnetic Pad</text>
    <text x="368" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="end">KSN</text>
</svg>