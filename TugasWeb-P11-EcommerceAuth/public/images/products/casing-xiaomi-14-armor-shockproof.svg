<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
    <defs>
        <linearGradient id="grad_23" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#991b1b" />
            <stop offset="100%" stop-color="#450a0a" />
        </linearGradient>
        <radialGradient id="glow_23" cx="50%" cy="40%" r="50%">
            <stop offset="0%" stop-color="#fca5a5" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#450a0a" stop-opacity="0"/>
        </radialGradient>
        <filter id="shadow_23" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
        </filter>
    </defs>
    
    <!-- Background Card -->
    <rect width="400" height="300" rx="16" fill="url(#grad_23)" />
    <circle cx="200" cy="130" r="140" fill="url(#glow_23)" />

    <!-- Top Badge -->
    <rect x="24" y="20" width="130" height="28" rx="14" fill="#000000" opacity="0.4"/>
    <text x="89" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">★ Armor Shockproof</text>

    <!-- Gadget Illustration -->
                <g transform="translate(140, 65)">
                <!-- Phone Case Outline -->
                <rect x="30" y="20" width="60" height="105" rx="14" fill="#ffffff" filter="drop-shadow(0 12px 20px rgba(0,0,0,0.3))"/>
                <!-- Camera cutout -->
                <rect x="38" y="28" width="22" height="24" rx="6" fill="#1e293b"/>
                <circle cx="45" cy="35" r="3" fill="#fca5a5"/>
                <circle cx="53" cy="35" r="3" fill="#fca5a5"/>
                <circle cx="45" cy="45" r="3" fill="#fca5a5"/>
                <!-- MagSafe Ring or design -->
                <circle cx="60" cy="75" r="16" fill="none" stroke="#fca5a5" stroke-width="3" opacity="0.7"/>
            </g>

    <!-- Bottom Glass Info Bar -->
    <rect x="16" y="215" width="368" height="68" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" filter="url(#shadow_23)"/>
    
    <!-- Text Labels -->
    <text x="32" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="0.5">XIAOMI 14 ARMOR</text>
    <text x="32" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#fca5a5">Heavy Duty Military Grade</text>
    <text x="368" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="end">KSN</text>
</svg>