<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
    <defs>
        <linearGradient id="grad_19" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#475569" />
            <stop offset="100%" stop-color="#1e293b" />
        </linearGradient>
        <radialGradient id="glow_19" cx="50%" cy="40%" r="50%">
            <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
        </radialGradient>
        <filter id="shadow_19" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
        </filter>
    </defs>
    
    <!-- Background Card -->
    <rect width="400" height="300" rx="16" fill="url(#grad_19)" />
    <circle cx="200" cy="130" r="140" fill="url(#glow_19)" />

    <!-- Top Badge -->
    <rect x="24" y="20" width="130" height="28" rx="14" fill="#000000" opacity="0.4"/>
    <text x="89" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">★ Over-Ear Foldable</text>

    <!-- Gadget Illustration -->
                <g transform="translate(140, 65)">
                <!-- Arch -->
                <path d="M20 70 A 40 40 0 0 1 100 70" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
                <!-- Earcups -->
                <rect x="12" y="60" width="20" height="40" rx="8" fill="#f59e0b" filter="drop-shadow(0 8px 12px rgba(0,0,0,0.4))"/>
                <rect x="88" y="60" width="20" height="40" rx="8" fill="#f59e0b" filter="drop-shadow(0 8px 12px rgba(0,0,0,0.4))"/>
                <!-- Mic -->
                <path d="M22 95 Q 40 120, 60 115" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
                <circle cx="60" cy="115" r="5" fill="#f59e0b"/>
            </g>

    <!-- Bottom Glass Info Bar -->
    <rect x="16" y="215" width="368" height="68" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" filter="url(#shadow_19)"/>
    
    <!-- Text Labels -->
    <text x="32" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="0.5">WIRELESS HEADPHONE</text>
    <text x="32" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#f59e0b">40mm Driver Bass Booster</text>
    <text x="368" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="end">KSN</text>
</svg>