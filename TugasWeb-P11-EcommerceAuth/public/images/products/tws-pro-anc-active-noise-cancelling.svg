<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
    <defs>
        <linearGradient id="grad_17" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#312e81" />
            <stop offset="100%" stop-color="#1e1b4b" />
        </linearGradient>
        <radialGradient id="glow_17" cx="50%" cy="40%" r="50%">
            <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
        </radialGradient>
        <filter id="shadow_17" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
        </filter>
    </defs>
    
    <!-- Background Card -->
    <rect width="400" height="300" rx="16" fill="url(#grad_17)" />
    <circle cx="200" cy="130" r="140" fill="url(#glow_17)" />

    <!-- Top Badge -->
    <rect x="24" y="20" width="130" height="28" rx="14" fill="#000000" opacity="0.4"/>
    <text x="89" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">★ Active ANC</text>

    <!-- Gadget Illustration -->
                <g transform="translate(140, 65)">
                <!-- Case -->
                <rect x="25" y="45" width="70" height="60" rx="24" fill="#ffffff" filter="drop-shadow(0 12px 20px rgba(0,0,0,0.3))"/>
                <line x1="25" y1="65" x2="95" y2="65" stroke="#e2e8f0" stroke-width="2"/>
                <circle cx="60" cy="80" r="3" fill="#818cf8"/>
                <!-- Floating Earbud -->
                <ellipse cx="60" cy="28" rx="14" ry="10" fill="#ffffff" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.2))"/>
                <rect x="56" y="32" width="8" height="22" rx="4" fill="#ffffff"/>
            </g>

    <!-- Bottom Glass Info Bar -->
    <rect x="16" y="215" width="368" height="68" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" filter="url(#shadow_17)"/>
    
    <!-- Text Labels -->
    <text x="32" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="0.5">TWS PRO ANC</text>
    <text x="32" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#818cf8">Hybrid Noise Cancellation</text>
    <text x="368" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="end">KSN</text>
</svg>