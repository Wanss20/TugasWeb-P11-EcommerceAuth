<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
    <defs>
        <linearGradient id="grad_2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f3f4f6" />
            <stop offset="100%" stop-color="#e5e7eb" />
        </linearGradient>
        <radialGradient id="glow_2" cx="50%" cy="40%" r="50%">
            <stop offset="0%" stop-color="#111827" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#e5e7eb" stop-opacity="0"/>
        </radialGradient>
        <filter id="shadow_2" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
        </filter>
    </defs>
    
    <!-- Background Card -->
    <rect width="400" height="300" rx="16" fill="url(#grad_2)" />
    <circle cx="200" cy="130" r="140" fill="url(#glow_2)" />

    <!-- Top Badge -->
    <rect x="24" y="20" width="130" height="28" rx="14" fill="#000000" opacity="0.4"/>
    <text x="89" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">★ 20W PD</text>

    <!-- Gadget Illustration -->
                <g transform="translate(140, 65)">
                <!-- Charger body -->
                <rect x="25" y="45" width="70" height="75" rx="14" fill="#ffffff" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.3))"/>
                <!-- Prongs -->
                <rect x="42" y="15" width="10" height="32" rx="4" fill="#cbd5e1"/>
                <rect x="68" y="15" width="10" height="32" rx="4" fill="#cbd5e1"/>
                <!-- Port / Accent icon -->
                <circle cx="60" cy="80" r="16" fill="#111827" opacity="0.2"/>
                <path d="M60 70 L52 82 L58 82 L57 92 L68 78 L62 78 Z" fill="#111827"/>
                <rect x="52" y="102" width="16" height="6" rx="3" fill="#94a3b8"/>
            </g>

    <!-- Bottom Glass Info Bar -->
    <rect x="16" y="215" width="368" height="68" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" filter="url(#shadow_2)"/>
    
    <!-- Text Labels -->
    <text x="32" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="0.5">iPHONE ADAPTOR</text>
    <text x="32" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#111827">Power Delivery USB-C</text>
    <text x="368" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="end">KSN</text>
</svg>