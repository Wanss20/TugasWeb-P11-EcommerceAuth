<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
    <defs>
        <linearGradient id="grad_37" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3f3f46" />
            <stop offset="100%" stop-color="#18181b" />
        </linearGradient>
        <radialGradient id="glow_37" cx="50%" cy="40%" r="50%">
            <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#18181b" stop-opacity="0"/>
        </radialGradient>
        <filter id="shadow_37" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
        </filter>
    </defs>
    
    <!-- Background Card -->
    <rect width="400" height="300" rx="16" fill="url(#grad_37)" />
    <circle cx="200" cy="130" r="140" fill="url(#glow_37)" />

    <!-- Top Badge -->
    <rect x="24" y="20" width="130" height="28" rx="14" fill="#000000" opacity="0.4"/>
    <text x="89" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">★ Camera Lens 9H</text>

    <!-- Gadget Illustration -->
                <g transform="translate(140, 65)">
                <!-- Shield Screen -->
                <rect x="32" y="22" width="56" height="100" rx="12" fill="none" stroke="#fbbf24" stroke-width="4" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.3))"/>
                <rect x="36" y="26" width="48" height="92" rx="8" fill="#ffffff" opacity="0.2"/>
                <!-- Sparkle -->
                <polygon points="60,45 63,55 73,58 63,61 60,71 57,61 47,58 57,55" fill="#fbbf24"/>
                <text x="60" y="95" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">9H HD</text>
            </g>

    <!-- Bottom Glass Info Bar -->
    <rect x="16" y="215" width="368" height="68" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" filter="url(#shadow_37)"/>
    
    <!-- Text Labels -->
    <text x="32" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="0.5">LENS PROTECTOR</text>
    <text x="32" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#fbbf24">Diamond Ring Camera Glass</text>
    <text x="368" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="end">KSN</text>
</svg>