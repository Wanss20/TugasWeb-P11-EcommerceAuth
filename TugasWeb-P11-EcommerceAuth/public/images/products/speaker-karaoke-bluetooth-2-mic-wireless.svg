<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
    <defs>
        <linearGradient id="grad_48" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#701a75" />
            <stop offset="100%" stop-color="#4a044e" />
        </linearGradient>
        <radialGradient id="glow_48" cx="50%" cy="40%" r="50%">
            <stop offset="0%" stop-color="#f0abfc" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#4a044e" stop-opacity="0"/>
        </radialGradient>
        <filter id="shadow_48" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
        </filter>
    </defs>
    
    <!-- Background Card -->
    <rect width="400" height="300" rx="16" fill="url(#grad_48)" />
    <circle cx="200" cy="130" r="140" fill="url(#glow_48)" />

    <!-- Top Badge -->
    <rect x="24" y="20" width="130" height="28" rx="14" fill="#000000" opacity="0.4"/>
    <text x="89" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">★ 2 Wireless Mic</text>

    <!-- Gadget Illustration -->
                <g transform="translate(140, 65)">
                <!-- Speaker Cylinder -->
                <rect x="30" y="35" width="60" height="85" rx="18" fill="#ffffff" filter="drop-shadow(0 14px 22px rgba(0,0,0,0.3))"/>
                <!-- Speaker Grille -->
                <circle cx="60" cy="62" r="16" fill="#f0abfc"/>
                <circle cx="60" cy="62" r="8" fill="#0f172a"/>
                <circle cx="60" cy="95" r="10" fill="#f0abfc" opacity="0.7"/>
                <circle cx="60" cy="95" r="4" fill="#0f172a"/>
            </g>

    <!-- Bottom Glass Info Bar -->
    <rect x="16" y="215" width="368" height="68" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" filter="url(#shadow_48)"/>
    
    <!-- Text Labels -->
    <text x="32" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="0.5">KARAOKE SPEAKER</text>
    <text x="32" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#f0abfc">Echo Effect &amp; Vocal Cut</text>
    <text x="368" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="end">KSN</text>
</svg>