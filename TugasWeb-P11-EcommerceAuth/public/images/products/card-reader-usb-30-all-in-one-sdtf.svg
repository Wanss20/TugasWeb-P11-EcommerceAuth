<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
    <defs>
        <linearGradient id="grad_53" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e293b" />
            <stop offset="100%" stop-color="#0f172a" />
        </linearGradient>
        <radialGradient id="glow_53" cx="50%" cy="40%" r="50%">
            <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
        </radialGradient>
        <filter id="shadow_53" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
        </filter>
    </defs>
    
    <!-- Background Card -->
    <rect width="400" height="300" rx="16" fill="url(#grad_53)" />
    <circle cx="200" cy="130" r="140" fill="url(#glow_53)" />

    <!-- Top Badge -->
    <rect x="24" y="20" width="130" height="28" rx="14" fill="#000000" opacity="0.4"/>
    <text x="89" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">★ USB 3.0 SD/TF</text>

    <!-- Gadget Illustration -->
                <g transform="translate(140, 65)">
                <rect x="35" y="45" width="50" height="60" rx="8" fill="#ffffff" filter="drop-shadow(0 10px 16px rgba(0,0,0,0.3))"/>
                <rect x="45" y="25" width="30" height="22" rx="3" fill="#cbd5e1"/>
                <rect x="50" y="30" width="8" height="6" fill="#1e293b"/>
                <rect x="62" y="30" width="8" height="6" fill="#1e293b"/>
                <!-- Type C other side -->
                <rect x="47" y="105" width="26" height="14" rx="4" fill="#a7f3d0"/>
            </g>

    <!-- Bottom Glass Info Bar -->
    <rect x="16" y="215" width="368" height="68" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" filter="url(#shadow_53)"/>
    
    <!-- Text Labels -->
    <text x="32" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="0.5">CARD READER ALL-IN-1</text>
    <text x="32" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#a7f3d0">High Speed Memory Card Adapter</text>
    <text x="368" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="end">KSN</text>
</svg>