<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
    <defs>
        <linearGradient id="grad_6" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#1e3a8a" />
        </linearGradient>
        <radialGradient id="glow_6" cx="50%" cy="40%" r="50%">
            <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
        </radialGradient>
        <filter id="shadow_6" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
        </filter>
    </defs>
    
    <!-- Background Card -->
    <rect width="400" height="300" rx="16" fill="url(#grad_6)" />
    <circle cx="200" cy="130" r="140" fill="url(#glow_6)" />

    <!-- Top Badge -->
    <rect x="24" y="20" width="130" height="28" rx="14" fill="#000000" opacity="0.4"/>
    <text x="89" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">★ 4-in-1 Ports</text>

    <!-- Gadget Illustration -->
                <g transform="translate(140, 65)">
                <rect x="20" y="35" width="80" height="90" rx="16" fill="#ffffff" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.3))"/>
                <rect x="40" y="12" width="10" height="25" rx="4" fill="#cbd5e1"/>
                <rect x="70" y="12" width="10" height="25" rx="4" fill="#cbd5e1"/>
                <!-- 4 ports -->
                <rect x="35" y="55" width="20" height="6" rx="2" fill="#3b82f6"/>
                <rect x="65" y="55" width="20" height="6" rx="2" fill="#3b82f6"/>
                <rect x="35" y="75" width="20" height="6" rx="2" fill="#3b82f6"/>
                <rect x="50" y="95" width="20" height="8" rx="4" fill="#f97316"/>
            </g>

    <!-- Bottom Glass Info Bar -->
    <rect x="16" y="215" width="368" height="68" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" filter="url(#shadow_6)"/>
    
    <!-- Text Labels -->
    <text x="32" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="0.5">MULTI-PORT CHARGER</text>
    <text x="32" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#93c5fd">3x USB-A + 1x Type-C PD</text>
    <text x="368" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="end">KSN</text>
</svg>